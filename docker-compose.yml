services:
  ioce-opps-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: qon-ioce-opps-api:local
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      MYELIN_JAR_PATH: "/app/jars"
      MYELIN_DB_PATH: "/app/data/myelin.db"
      MYELIN_DOWNLOAD_CMS_ASSETS: "false"
      HHA_ENABLED: "${HHA_ENABLED:-false}"
      # Needs a sealed ESRD reference release in data/myelin.db; the bridge will not start without one.
      ESRD_ENABLED: "${ESRD_ENABLED:-false}"
      # CMS I/OCE + FQHC Pricer 2.10.0 for 77X claims (CY 2025-2026); the jar hash is checked at startup.
      FQHC_ENABLED: "${FQHC_ENABLED:-false}"
      # CMS Hospice Pricer 2.7.1 for 81X/82X claims (FY 2026-2027); the jar hash is checked at startup.
      HOSPICE_ENABLED: "${HOSPICE_ENABLED:-false}"
      # I/OCE edits callers may bypass per line, such as "12". Empty turns it off.
      IOCE_EDIT_BYPASS_ALLOWED: "${IOCE_EDIT_BYPASS_ALLOWED:-}"
      # Provider types callers may supply an OPPS provider context for, such as "37". Empty turns it off.
      OPPS_PROVIDER_CONTEXT_TYPES: "${OPPS_PROVIDER_CONTEXT_TYPES:-}"
      # Optional override must match the verified HHA 2.6.0 JAR hash.
      # HHA_JAR_PATH: "/app/jars/pricers/hha-pricer-application-2.6.0.jar"
      # Set this only when the image contains more than one OPPS Pricer JAR.
      # OPPS_JAR_PATH: "/app/jars/pricers/opps-pricer-application-2.16.0.jar"
    restart: unless-stopped
